<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RunningWorkout">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title>Running Workout App</title>
  <link rel="icon" type="image/png" href="assets/icons/favicon.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
</head>
<body>

  <!-- Haupt-Startmenü -->
  <div id="start-menu-view" class="menu-container">
    <header class="menu-header">
      <div class="menu-title-wrap">
        <h1>Workouts</h1>
        <p class="menu-subtitle">Wähle dein Training</p>
      </div>
      <button id="btn-toggle-edit" class="icon-btn gear-btn" title="Namen bearbeiten">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <div id="edit-hint" class="edit-hint hidden">Klicke auf ein Workout, um den Namen zu ändern</div>

    <div class="workout-grid" id="workout-grid">
      <!-- Wird dynamsich per JS befüllt -->
    </div>
  </div>

  <!-- Einzelnes Workout View (standardmäßig ausgeblendet) -->
  <div id="workout-view" class="app-container hidden">
    
    <!-- Exit / Menü Button oben links -->
    <button id="btn-back-menu" class="btn-back">✕ Menü</button>

    <!-- Start & Pause Overlay -->
    <div id="start-overlay" class="start-overlay">
      <div class="ring-container play-ring" id="overlay-ring-container">
        <svg class="progress-ring" viewBox="0 0 120 120">
          <circle class="progress-ring__circle-bg" cx="60" cy="60" r="52"></circle>
          <circle class="progress-ring__circle" id="overlay-progress-circle" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="ring-content" id="overlay-ring-content">
          <button id="btn-overlay-play" class="play-btn">▶</button>
          
          <div id="pause-info" class="hidden" style="display: none; flex-direction: column; align-items: center;">
            <div class="pause-label">Pause</div>
            <div class="pause-countdown-text" id="pause-countdown">00:15</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Top Bar mit 3-Spalten Grid für exakte X-Achsen-Zentrierung -->
    <header class="top-bar">
      <div class="header-left">
        <div class="roman-num" id="exercise-nr">I</div>
        <div class="side-indicator" id="exercise-side">Seite:<br><span>LINKS</span></div>
      </div>
      
      <div class="header-center">
        <div class="ring-container timer-ring">
          <svg class="progress-ring" viewBox="0 0 120 120">
            <circle class="progress-ring__circle-bg" cx="60" cy="60" r="52"></circle>
            <circle class="progress-ring__circle" id="timer-progress-circle" cx="60" cy="60" r="52"></circle>
          </svg>
          <div class="ring-content">
            <div class="timer-display" id="timer-display">30</div>
          </div>
        </div>
      </div>

      <div class="header-right">
        <div class="reps-display" id="exercise-umfang">20x</div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="content-body">
      <h1 class="exercise-title" id="exercise-title">Seitliches Beinheben im Liegen</h1>
      <p class="exercise-category" id="exercise-category">Hüftabduktion / Gluteus Medius</p>

      <div class="media-card">
        <img id="exercise-gif" src="assets/gifs/1.gif" alt="Übungsausführung" onerror="this.src='https://via.placeholder.com/400x400?text=GIF+Platzhalter'">
      </div>

      <p class="exercise-hint" id="exercise-hint">Mit Widerstandsband um die Sprunggelenke</p>
    </main>

    <!-- Footer Controls -->
    <footer class="bottom-bar">
      <div class="next-preview">
        <span>Nächste Übung:</span>
        <strong id="next-title">Seitliches Beinheben im Liegen (R)</strong>
      </div>
      <div class="controls">
        <button id="btn-prev" class="btn-secondary">◄</button>
        <button id="btn-play" class="btn-primary">START</button>
        <button id="btn-next" class="btn-secondary">►</button>
      </div>
    </footer>
  </div>

  <script src="workouts.js"></script>
  <script src="app.js"></script>
</body>
</html>
