<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RunningWorkout">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title>Running Workout App</title>
  <link rel="icon" type="image/png" href="assets/icons/favicon.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
</head>
<body>
  <div class="app-container">
    
    <!-- Start & Pause Overlay -->
    <div id="start-overlay" class="start-overlay">
      <div class="ring-container play-ring" id="overlay-ring-container">
        <svg class="progress-ring" viewBox="0 0 120 120">
          <circle class="progress-ring__circle-bg" cx="60" cy="60" r="52"></circle>
          <circle class="progress-ring__circle" id="overlay-progress-circle" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="ring-content" id="overlay-ring-content">
          <button id="btn-overlay-play" class="play-btn">▶</button>
          
          <div id="pause-info" class="hidden" style="display: none; flex-direction: column; align-items: center;">
            <div class="pause-label">Pause</div>
            <div class="pause-countdown-text" id="pause-countdown">00:15</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Top Bar mit 3-Spalten Grid für exakte X-Achsen-Zentrierung -->
    <header class="top-bar">
      <div class="header-left">
        <div class="roman-num" id="exercise-nr">I</div>
        <div class="side-indicator" id="exercise-side">Seite:<br><span>LINKS</span></div>
      </div>
      
      <div class="header-center">
        <div class="ring-container timer-ring">
          <svg class="progress-ring" viewBox="0 0 120 120">
            <circle class="progress-ring__circle-bg" cx="60" cy="60" r="52"></circle>
            <circle class="progress-ring__circle" id="timer-progress-circle" cx="60" cy="60" r="52"></circle>
          </svg>
          <div class="ring-content">
            <div class="timer-display" id="timer-display">30</div>
          </div>
        </div>
      </div>

      <div class="header-right">
        <div class="reps-display" id="exercise-umfang">20x</div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="content-body">
      <h1 class="exercise-title" id="exercise-title">Seitliches Beinheben im Liegen</h1>
      <p class="exercise-category" id="exercise-category">Hüftabduktion / Gluteus Medius</p>

      <div class="media-card">
        <img id="exercise-gif" src="assets/gifs/1.gif" alt="Übungsausführung" onerror="this.src='https://via.placeholder.com/400x400?text=GIF+Platzhalter'">
      </div>

      <p class="exercise-hint" id="exercise-hint">Mit Widerstandsband um die Sprunggelenke</p>
    </main>

    <!-- Footer Controls -->
    <footer class="bottom-bar">
      <div class="next-preview">
        <span>Nächste Übung:</span>
        <strong id="next-title">Seitliches Beinheben im Liegen (R)</strong>
      </div>
      <div class="controls">
        <button id="btn-prev" class="btn-secondary">◄</button>
        <button id="btn-play" class="btn-primary">START</button>
        <button id="btn-next" class="btn-secondary">►</button>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
