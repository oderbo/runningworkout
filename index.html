<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RunningWorkout">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title>Running Workout App</title>
</head>
<body>
  <div class="app-container">
    <header class="top-bar">
      <div class="roman-num" id="exercise-nr">I</div>
      <div class="reps-badge" id="exercise-umfang">20 WH</div>
      <div class="timer-badge" id="timer-display">00:30</div>
    </header>

    <main class="content-body">
      <div class="side-indicator" id="exercise-side">SEITE: L</div>
      <h1 class="exercise-title" id="exercise-title">Seitliches Beinheben im Liegen</h1>
      <p class="exercise-category" id="exercise-category">Hüftabduktion / Gluteus Medius</p>

      <div class="media-card">
        <img id="exercise-gif" src="assets/gifs/1.gif" alt="Übungsausführung" onerror="this.src='https://via.placeholder.com/400x300?text=GIF+Platzhalter'">
      </div>

      <p class="exercise-hint" id="exercise-hint">Mit Widerstandsband um die Sprunggelenke</p>
    </main>

    <footer class="bottom-bar">
      <div class="next-preview">
        <span>Nächste Übung:</span>
        <strong id="next-title">Seitliches Beinheben im Liegen (R)</strong>
      </div>
      <div class="controls">
        <button id="btn-prev" class="btn-secondary">◄</button>
        <button id="btn-play" class="btn-primary">START</button>
        <button id="btn-next" class="btn-secondary">►</button>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
